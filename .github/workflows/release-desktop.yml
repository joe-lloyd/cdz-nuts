name: release desktop

# Tag a version to ship the desktop app:
#   git tag desktop-v0.5.0 && git push origin desktop-v0.5.0
#
# Prefixed tags because this repository also holds the server and the front
# end; a bare v* would mean every tag is a desktop release.
#
# Builds every platform, signs the bundles with the updater key, and publishes
# them to a GitHub Release together with latest.json -- which is the file the
# running app polls to discover there is a newer version.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

jobs:
  release:
    permissions:
      contents: write # to create the release and upload bundles to it
    strategy:
      fail-fast: false
      # One at a time, deliberately. Every job appends its platform to the same
      # latest.json on the same release, so running them together means one job
      # deleting that asset while another updates it -- which fails with a bare
      # "Not Found" after its own bundles have already uploaded. The release
      # then looks complete while silently missing a platform from the updater
      # manifest, so that platform installs fine and never updates again.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # Ubuntu 22.04 rather than latest: the AppImage produced on a newer glibc
      # refuses to start on anything older, and this is the oldest runner Tauri
      # v2 still supports. Building on the newest available would quietly narrow
      # who can run it.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        # This normally takes a minute. On 2026-11-11 it hung for over an hour,
        # and with the builds running one at a time Windows waited behind it.
        # Fail fast instead, so a rerun is the fix rather than a six-hour wait.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate icons from the shared UI package
        run: |
          python -m pip install --quiet pillow
          python apps/desktop/scripts/make-icons.py

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is what makes the updater trust a download. Without these
          # the bundles build fine and the update path is dead, which is a
          # failure you would not notice until you shipped a second version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'cdz-nutz __VERSION__'
          releaseBody: |
            Install with one line — see the README for what each script does.

            **macOS** (Apple Silicon or Intel; handles Gatekeeper for you)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/joe-lloyd/cdz-nuts/main/apps/desktop/scripts/install-macos.sh | bash
            ```

            **Linux** (AppImage)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/joe-lloyd/cdz-nuts/main/apps/desktop/scripts/install-linux.sh | bash
            ```

            **Windows** (PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/joe-lloyd/cdz-nuts/main/apps/desktop/scripts/install-windows.ps1 | iex
            ```

            Builds are unsigned — there is no Apple Developer ID and no Windows
            code-signing certificate. The install scripts deal with what that
            means on each platform. Once installed, the app updates itself from
            the tray.
          # Created as a DRAFT, then published by the step below as soon as
          # both macOS builds are in, without waiting for Linux and Windows.
          # The builds run one at a time, so holding the release for all four
          # kept every Mac waiting the best part of an hour for platforms it
          # does not use.
          #
          # `releases/latest/download/latest.json` is what the app polls, so a
          # live release missing a platform used to make that platform's
          # clients report "None of the fallback platforms [windows-x86_64]
          # were found", which looked like a broken build. The app treats that
          # as "nothing new for you yet" since 0.7.3 (update.rs), and the
          # other platforms add themselves to the live release as they finish.
          # A single-platform draft is still never published: the step checks
          # the Mac entries, and the job below checks all four at the end.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true # this is latest.json, which the app polls
          args: ${{ matrix.args }}

      - name: Go live as soon as both macOS builds are in
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for want in 'aarch64.app.tar.gz.sig' 'x64.app.tar.gz.sig' 'latest.json'; do
            grep -q "$want" <<<"$assets" || { echo "not yet: missing $want"; exit 0; }
          done
          # The bundles being there is not enough: the updater only sees what
          # latest.json names.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -O latest.json --clobber
          for platform in darwin-aarch64 darwin-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json >/dev/null \
              || { echo "not yet: latest.json has no $platform"; exit 0; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "published $TAG for macOS; Linux and Windows join as they finish"

  # Nothing is downloadable until this runs, and it only runs if all four
  # platform jobs succeeded. One platform failing now leaves a draft to inspect
  # rather than a release advertising an update half its users cannot install.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By now macOS has normally published it already. This is the check
      # that every platform made it in, and the publish for a run where the
      # macOS step could not.
      - name: Publish the release once every platform is in it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The updater reads latest.json, so a release without one would be
          # published and silently un-updatable. Check before flipping it live.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          grep -qx 'latest.json' assets.txt
          for want in 'x64-setup.exe' 'amd64.AppImage' 'aarch64.app.tar.gz' 'x64.app.tar.gz'; do
            grep -q "$want" assets.txt || { echo "missing $want"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "published $TAG"
