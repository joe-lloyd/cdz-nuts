name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The front end. typecheck, unit and contract tests, then the check that
  # matters most in this repository: public/ is BUILD OUTPUT that is committed,
  # because apps/server serves it off a bind mount and apps/desktop embeds it
  # with include_dir!, and neither runs a JS toolchain. A source change
  # committed without rebuilding would sail through every test and then ship a
  # bundle that does not contain it.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cdz-nuts/ui typecheck
      - run: pnpm --filter @cdz-nuts/ui test:unit
      - run: pnpm --filter @cdz-nuts/ui test:contract
      - name: The committed bundle is the one this source builds
        run: |
          pnpm --filter @cdz-nuts/ui build
          if ! git diff --quiet -- packages/ui/public; then
            echo "::error::packages/ui/public is not up to date with src/. Run 'pnpm build' and commit the result."
            git diff --stat -- packages/ui/public
            exit 1
          fi

  # The Node server. Zero runtime dependencies; the install is for types only.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cdz-nuts/server test

  # The Rust unit tests -- manifest parsing, header handling, CA validity --
  # are platform-independent, so run them once on the cheapest runner rather
  # than three times across the matrix.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  bundle:
    needs: [ui, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev             librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate icons from the shared UI package
        run: |
          python -m pip install --quiet pillow
          python apps/desktop/scripts/make-icons.py

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle
        # The signing key is not optional here, even though nothing is
        # published from this workflow. tauri.conf.json names an updater
        # public key, and Tauri refuses to finish a bundle when it finds one
        # with no private key to match -- so without these every bundle job
        # built its artifacts and then exited 1 on the very last step. That is
        # why this workflow had never once gone green since 0.2.0.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The Tauri CLI finds src-tauri by walking up from cwd, so run it there.
        working-directory: apps/desktop
        run: cargo tauri build --target ${{ matrix.target }}

      # Unsigned on purpose: there is no Apple Developer ID and no Windows
      # code-signing certificate. On macOS, run scripts/macos-allow-unsigned.sh
      # after downloading -- see the README.
      - uses: actions/upload-artifact@v4
        with:
          name: homelab-music-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
