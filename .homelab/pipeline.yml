# What the homelab builds for this repo, and where.
#
# GitHub Actions is a doorbell here, not a build system: .github/workflows/
# signs a payload and hands the work to https://builds.home.arpa, which runs it
# on hardware we own. See homelab-task-runner for the control plane.
#
# Only the desktop app is built here. The server deploys as a git pull on
# pi-server and the front end's own tests run on GitHub, so these pipelines
# answer one question: does apps/desktop still compile against packages/ui.
#
# Two things this repo breaks on if they are not explicit:
#
# 1. The binary embeds `packages/ui/public` at compile time. That directory is
#    committed build output; an empty one does not fail -- `include_dir!` on
#    an empty directory produces a build that succeeds and an app with no UI.
#    The sanity step below is there because that failure is silent.
# 2. The desktop is a Cargo workspace under `apps/desktop/src-tauri/`, not an
#    npm project. Every cargo command needs --manifest-path.
# 3. Bundling requires the updater signing key. Tauri refuses to finish a bundle
#    when tauri.conf.json names a public key and no private key is present, so
#    the unsigned CI path builds with --no-bundle and the signed bundles live in
#    the release pipelines, which declare `secrets:`.

version: 1

pipelines:
  download-macos:
    runs_on: [macos]
    timeout: 3600
    concurrency: cdz-nuts-ci-macos
    cache: [cargo]
    min_free_gb: 25
    artifacts:
      - name: macos
        path: dist/*.zip
    steps:
      - name: verify-and-bundle
        run: |
          set -eu
          test -f packages/ui/routes.json && test -s packages/ui/public/app.js
          export CARGO_TARGET_DIR="$CARGO_HOME/target/cdz-nuts/${CONDUCTOR_TRUST:-local}"
          (cd packages/ui && node --test test/*.test.js)
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          mkdir -p dist
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            (cd apps/desktop && cargo tauri build --target "$target" --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}')
            app="$CARGO_TARGET_DIR/$target/release/bundle/macos/Homelab Music.app"
            test -x "$app/Contents/MacOS/homelab-music"
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Homelab-Music-$target.zip"
          done

  # The every-push path. No secrets, no bundles, nothing to publish -- just the
  # question "does this still build and pass its tests", answered on eliot.
  ci:
    runs_on: [linux, docker]
    image: desktop-build:1
    timeout: 2700
    concurrency: cdz-nuts-ci
    cache: [cargo, npm]
    min_free_gb: 25
    steps:
      - name: ui-sanity
        run: |
          # An empty packages/ui/public compiles clean and ships an app with no
          # interface. Fail here, loudly, rather than there, silently.
          test -f packages/ui/routes.json && test -s packages/ui/public/app.js || {
            echo "packages/ui is incomplete: no routes.json, or public/app.js is empty."
            echo "This build would produce an app with no UI."
            exit 1
          }

      - name: ui-contract
        working_dir: packages/ui
        run: node --test test/*.test.js

      - name: fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Proves it links against the real WebKit stack, which `cargo test` does
      # not. --no-bundle because bundling would demand the signing key for a
      # binary this pipeline throws away.
      - name: compile
        run: |
          python3 apps/desktop/scripts/make-icons.py
          # The Tauri CLI finds src-tauri by walking up from cwd, so run it there.
          (cd apps/desktop && cargo tauri build --no-bundle)

  # The same question for macOS, which no Linux runner can answer. old-mac is
  # an Intel i9, so aarch64 is a real cross-compile rather than the free ride it
  # gets on GitHub's arm64 hosts -- both targets are named explicitly.
  ci-macos:
    runs_on: [macos]
    timeout: 3600
    concurrency: cdz-nuts-ci-macos
    cache: [cargo]
    min_free_gb: 25
    steps:
      - name: ui-sanity
        run: |
          test -f packages/ui/routes.json && test -s packages/ui/public/app.js || {
            echo "packages/ui/public is empty; this build would have no UI."
            exit 1
          }
      - name: test
        run: |
          # CARGO_HOME keeps downloaded crates; the job checkout is deleted.
          # Keep compiled dependencies too, with separate caches by trust level.
          export CARGO_TARGET_DIR="$CARGO_HOME/target/cdz-nuts/${CONDUCTOR_TRUST:-local}"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: compile-x86_64
        run: |
          export CARGO_TARGET_DIR="$CARGO_HOME/target/cdz-nuts/${CONDUCTOR_TRUST:-local}"
          (cd apps/desktop && cargo tauri build --no-bundle --target x86_64-apple-darwin)
      - name: compile-aarch64
        run: |
          export CARGO_TARGET_DIR="$CARGO_HOME/target/cdz-nuts/${CONDUCTOR_TRUST:-local}"
          (cd apps/desktop && cargo tauri build --no-bundle --target aarch64-apple-darwin)
